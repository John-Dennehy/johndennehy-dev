services:
  payload:
    image: node:22-alpine
    ports:
      - '3000:3000'
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
    working_dir: /home/node/app/
    command: sh -c "corepack enable && corepack prepare pnpm@latest --activate && pnpm install && pnpm dev"
    env_file:
      - .env
    # Note: This compose file is for local development only.
    # The database is Neon Postgres (remote), so no local DB service is needed.
    # If you want a local Postgres instance, uncomment the section below
    # and update DATABASE_URL in .env to: postgresql://payload:payload@postgres:5432/payload
    # depends_on:
    #   - postgres

  # Uncomment for local Postgres development
  # postgres:
  #   image: postgres:16-alpine
  #   restart: always
  #   ports:
  #     - '5432:5432'
  #   environment:
  #     POSTGRES_USER: payload
  #     POSTGRES_PASSWORD: payload
  #     POSTGRES_DB: payload
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data

volumes:
  node_modules:
  # pgdata:
